{% extends "base.html" %}
{% block title %}Secure Access – CONTRAconnect{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <i class="bi bi-shield-lock text-dark" style="font-size: 2rem;"></i>
                    <h4 class="mt-2 mb-1">Authorised Access</h4>
                    <p class="text-muted small">Restricted administrative sign-in</p>
                </div>
                <form method="post" action="{{ url_for('admin_access') }}" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required autocomplete="username"
                               placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" id="adminPassword" class="form-control" required
                                   autocomplete="current-password" minlength="10" placeholder="Password">
                            <button class="btn btn-outline-secondary" type="button" id="toggleAdminPw"
                                    title="Show/hide password" aria-label="Show password">
                                <i class="bi bi-eye" id="adminPwIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-shield-lock"></i> Sign in
                    </button>
                </form>
                <p class="text-center small text-muted mt-3 mb-0">
                    <a href="{{ url_for('login') }}">← Back to provider login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
    const btn = document.getElementById('toggleAdminPw');
    const input = document.getElementById('adminPassword');
    const icon = document.getElementById('adminPwIcon');
    if (btn && input) {
        btn.addEventListener('click', function () {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }
})();
</script>
{% endblock %}
