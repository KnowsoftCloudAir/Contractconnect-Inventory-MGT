<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restricted area</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <style>
    body.restricted-bg {
      min-height: 100vh;
      background: linear-gradient(160deg, #0b6e6e 0%, #1a3a4a 45%, #0d1b24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .restrict-card {
      background: rgba(255,255,255,0.96);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
  </style>
</head>
<body class="restricted-bg">
  <div class="restrict-card">
    <div class="mb-3 text-danger" style="font-size:3rem"><i class="bi bi-shield-lock"></i></div>
    <h1 class="h3 text-danger">Restricted area</h1>
    <p class="text-muted">{{ message or 'You do not have permission to view this page.' }}</p>
    <div class="d-grid gap-2 mt-4">
      <button type="button" class="btn btn-success" onclick="if (history.length > 1) history.back(); else location.href='{{ url_for('index') }}';">
        <i class="bi bi-arrow-left"></i> Return to previous page
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Go to home</a>
    </div>
  </div>
</body>
</html>
