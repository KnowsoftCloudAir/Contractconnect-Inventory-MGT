{% extends "base.html" %}
{% block title %}Register – CONTRAconnect{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h4 class="mb-3">Service Provider Registration</h4>
                <p class="text-muted">Register your kiosk, PHC or outlet. An administrator will activate your account.</p>
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password *</label>
                            <input type="password" name="password" class="form-control" required minlength="6">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Facility / Outlet Name *</label>
                            <input type="text" name="facility_name" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Type *</label>
                            <select name="facility_type" class="form-select" required>
                                <option value="kiosk">Kiosk</option>
                                <option value="phc">Primary Health Centre (PHC)</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 d-grid gap-2">
                        <button type="submit" class="btn btn-success">Submit Registration</button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
