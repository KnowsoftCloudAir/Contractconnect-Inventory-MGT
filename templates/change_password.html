{% extends "base.html" %}
{% block title %}Change Password – Project Financial Management Workflow{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h4 class="mb-1"><i class="bi bi-key"></i> Change password</h4>
                <p class="text-muted small">Choose a strong password. You will stay signed in after the change.</p>
                <form method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Current password *</label>
                        <input type="password" name="current_password" class="form-control" required
                               autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New password *</label>
                        <input type="password" name="new_password" class="form-control" required
                               autocomplete="new-password" minlength="8"
                               placeholder="{% if current_user.role == 'admin' %}Min. 10 chars, upper, lower, number, symbol{% else %}Min. 8 characters{% endif %}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm new password *</label>
                        <input type="password" name="confirm_password" class="form-control" required
                               autocomplete="new-password" minlength="8">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Update password</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
