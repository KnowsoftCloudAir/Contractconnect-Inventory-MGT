{% extends "base.html" %}
{% block title %}Choose new password – CONTRAconnect{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-header"><h4 class="mb-0">Choose a new password</h4></div>
        <div class="auth-body">
            <ul class="small text-muted">
                <li>Minimum 8 characters (10+ for admin roles)</li>
                <li>Admins: upper, lower, number, special character</li>
            </ul>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm password</label>
                    <input type="password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <button class="btn btn-success w-100">Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
