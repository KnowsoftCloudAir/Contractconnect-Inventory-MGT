{% extends "base.html" %}
{% block title %}Request Stock – CONTRAconnect{% endblock %}
{% block content %}
<h2 class="mb-4">Request Replenishment – {{ facility.name }}</h2>
<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Product *</label>
                        <select name="product_id" class="form-select" required>
                            <option value="">Select product…</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (₦{{ '%.2f'|format(p.unit_cost) }} / {{ p.unit }})</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Cost is set by the Admin catalogue and cannot be changed.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity Needed *</label>
                        <input type="number" name="quantity" class="form-control" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Justification</label>
                        <textarea name="justification" class="form-control" rows="3" placeholder="e.g. High demand, approaching stock-out…"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Submit Request</button>
                    <a href="{{ url_for('provider_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
