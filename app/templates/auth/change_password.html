{% extends "base.html" %}
{% block title %}Change password – Churchgate{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-navy-900 mb-2">Change password</h1>
  <p class="text-sm text-slate-500 mb-6">Signed in as <strong>{{ user.email }}</strong></p>
  {% if error %}
  <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-100 text-red-700 text-sm">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-800 text-sm">{{ success }}</div>
  {% endif %}
  <form method="post" action="/auth/change-password" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
      <input type="password" name="current_password" required autocomplete="current-password"
             class="w-full px-4 py-2.5 rounded-xl border border-slate-300">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
      <input type="password" name="new_password" required minlength="6" autocomplete="new-password"
             class="w-full px-4 py-2.5 rounded-xl border border-slate-300"
             placeholder="At least 6 characters">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
      <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password"
             class="w-full px-4 py-2.5 rounded-xl border border-slate-300">
    </div>
    <button type="submit" class="w-full py-3 rounded-xl bg-navy-900 text-white font-semibold">Update password</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">
    <a href="javascript:history.back()" class="text-blue-700 hover:underline">← Back</a>
  </p>
</div>
{% endblock %}
