{% extends "base.html" %}
{% block title %}Join as Member – Knowsoft Churchgate{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold mb-2">Member Registration</h1>
  <p class="text-sm text-slate-500 mb-6">Select your church hierarchy. Your district admin will approve before full access.</p>
  {% if error %}<div class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg">{{ error }}</div>{% endif %}
  <form method="post" action="/join" enctype="multipart/form-data" class="bg-white rounded-2xl border p-6 space-y-4"
        x-data="churchCascade()" x-init="init()">
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium">Global Church *</label>
        <select name="global_id" x-model="globalId" @change="loadCountries()" required class="w-full mt-1 px-3 py-2 rounded-xl border">
          <option value="">— Select —</option>
          {% for g in globals %}
          <option value="{{ g.id }}">{{ g.name }} ({{ g.code }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-sm font-medium">Country Church *</label>
        <select name="country_id" x-model="countryId" @change="loadStates()" required class="w-full mt-1 px-3 py-2 rounded-xl border">
          <option value="">— Select —</option>
          <template x-for="c in countries" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium">State Church *</label>
        <select name="state_id" x-model="stateId" @change="loadGroups()" required class="w-full mt-1 px-3 py-2 rounded-xl border">
          <option value="">— Select —</option>
          <template x-for="c in states" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium">Group Church *</label>
        <select name="group_id" x-model="groupId" @change="loadDistricts()" required class="w-full mt-1 px-3 py-2 rounded-xl border">
          <option value="">— Select —</option>
          <template x-for="c in groups" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="text-sm font-medium">District Church *</label>
        <select name="district_id" required class="w-full mt-1 px-3 py-2 rounded-xl border">
          <option value="">— Select —</option>
          <template x-for="c in districts" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </div>
    </div>
    <hr>
    <input name="full_name" required placeholder="Full name *" class="w-full px-3 py-2 rounded-xl border">
    <div class="grid sm:grid-cols-2 gap-4">
      <select name="sex" required class="w-full px-3 py-2 rounded-xl border">
        <option value="">Sex *</option>
        <option value="brother">Brother</option>
        <option value="sister">Sister</option>
      </select>
      <select name="age_category" required class="w-full px-3 py-2 rounded-xl border">
        <option value="">Age category *</option>
        <option value="child">Child (1–15)</option>
        <option value="youth">Youth (16–20)</option>
        <option value="campus">Campus / Young adult (21–40)</option>
        <option value="adult">Adult (30–100)</option>
      </select>
      <select name="confession" required class="w-full px-3 py-2 rounded-xl border">
        <option value="">Confession *</option>
        <option value="saved">Saved</option>
        <option value="unsaved">Unsaved</option>
        <option value="backslidden">Backslidden</option>
        <option value="restored">Restored</option>
      </select>
      <div>
        <label class="text-xs text-slate-500">Member since</label>
        <input type="date" name="member_since" class="w-full px-3 py-2 rounded-xl border">
      </div>
    </div>
    <input type="email" name="email" required placeholder="Email (login) *" class="w-full px-3 py-2 rounded-xl border">
    <input type="password" name="password" required minlength="6" placeholder="Password *" class="w-full px-3 py-2 rounded-xl border">
    <input name="whatsapp" placeholder="WhatsApp number" class="w-full px-3 py-2 rounded-xl border">
    <input name="phone" placeholder="Phone" class="w-full px-3 py-2 rounded-xl border">
    <input name="address" placeholder="Current address" class="w-full px-3 py-2 rounded-xl border">
    <textarea name="prayer_request" rows="2" placeholder="Challenge / Prayer request" class="w-full px-3 py-2 rounded-xl border"></textarea>
    <div>
      <label class="text-sm font-medium">Profile picture</label>
      <input type="file" name="profile_pic" accept="image/*" class="w-full mt-1 text-sm">
    </div>
    <button class="w-full py-3 rounded-xl bg-teal-500 text-white font-semibold">Submit for approval</button>
  </form>
</div>
<script>
function churchCascade() {
  return {
    globalId: '', countryId: '', stateId: '', groupId: '',
    countries: [], states: [], groups: [], districts: [],
    init() {},
    async load(parentId) {
      if (!parentId) return [];
      const r = await fetch('/api/churches?parent_id=' + parentId);
      return await r.json();
    },
    async loadCountries() { this.countries = await this.load(this.globalId); this.states=[]; this.groups=[]; this.districts=[]; this.countryId=''; this.stateId=''; this.groupId=''; },
    async loadStates() { this.states = await this.load(this.countryId); this.groups=[]; this.districts=[]; this.stateId=''; this.groupId=''; },
    async loadGroups() { this.groups = await this.load(this.stateId); this.districts=[]; this.groupId=''; },
    async loadDistricts() { this.districts = await this.load(this.groupId); },
  }
}
</script>
{% endblock %}
