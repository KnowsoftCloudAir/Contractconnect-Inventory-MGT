{% extends "base.html" %}
{% block title %}New focus group{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-4">Create focus group</h1>
  <form method="post" action="/focus-groups/new" class="bg-white rounded-2xl border p-6 space-y-4">
    <input name="name" required placeholder="Group name *" class="w-full px-3 py-2.5 rounded-xl border">
    <textarea name="description" rows="2" placeholder="Purpose (optional)" class="w-full px-3 py-2.5 rounded-xl border"></textarea>
    <p class="text-sm font-semibold text-slate-700">Select members</p>
    <div class="max-h-64 overflow-y-auto border rounded-xl p-3 space-y-2">
      {% for m in members %}
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="member_ids" value="{{ m.id }}"> {{ m.full_name }}
        <span class="text-xs text-slate-400">{{ m.email or "" }}</span>
      </label>
      {% else %}
      <p class="text-sm text-slate-400">No approved members yet.</p>
      {% endfor %}
    </div>
    <button class="w-full py-3 rounded-xl bg-navy-900 text-white font-semibold">Create</button>
  </form>
</div>
{% endblock %}
