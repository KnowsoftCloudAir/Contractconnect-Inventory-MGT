{% extends "base.html" %}
{% block title %}Create Sub-Church{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-8">
  <h1 class="text-xl font-bold mb-2">Create {{ next_level|capitalize }} under {{ parent.name }}</h1>
  <p class="text-sm text-slate-500 mb-6">Parent code: {{ parent.code }}</p>
  <form method="post" action="/church/create-child" class="bg-white rounded-2xl border p-6 space-y-4">
    <input name="name" required placeholder="Church name *" class="w-full px-4 py-3 rounded-xl border">
    <input name="resident_pastor" placeholder="Resident pastor" class="w-full px-4 py-3 rounded-xl border">
    <input name="admin_full_name" required placeholder="Admin full name *" class="w-full px-4 py-3 rounded-xl border">
    <input type="email" name="admin_email" required placeholder="Admin email (login) *" class="w-full px-4 py-3 rounded-xl border">
    <input type="password" name="admin_password" required minlength="6" placeholder="Admin password *" class="w-full px-4 py-3 rounded-xl border">
    <button class="w-full py-3 rounded-xl bg-teal-500 text-white font-semibold">Create & issue login</button>
  </form>
</div>
{% endblock %}
