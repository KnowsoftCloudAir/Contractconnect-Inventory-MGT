<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- soft light -->
  <ellipse cx="600" cy="200" rx="280" ry="120" fill="#fbbf24" opacity="0.12"/>
  <!-- ground -->
  <rect y="620" width="1200" height="180" fill="#0a1525"/>
  <!-- church body -->
  <rect x="380" y="380" width="440" height="260" fill="#e8eef5" rx="4"/>
  <rect x="400" y="400" width="100" height="140" fill="#0f2744" opacity="0.85"/>
  <rect x="700" y="400" width="100" height="140" fill="#0f2744" opacity="0.85"/>
  <!-- door -->
  <path d="M560 520 h80 v120 h-80 z" fill="#0f2744"/>
  <path d="M560 520 h80 v0 a40 40 0 0 0 -80 0" fill="#1e3a5f"/>
  <!-- roof -->
  <polygon points="360,380 600,220 840,380" fill="#1e3a5f"/>
  <polygon points="360,380 600,220 840,380" fill="none" stroke="#0a192f" stroke-width="2"/>
  <!-- steeple -->
  <rect x="570" y="140" width="60" height="100" fill="#e8eef5"/>
  <polygon points="555,140 600,70 645,140" fill="#1e3a5f"/>
  <!-- cross on steeple -->
  <rect x="592" y="28" width="16" height="55" fill="url(#gold)" rx="2"/>
  <rect x="572" y="42" width="56" height="14" fill="url(#gold)" rx="2"/>
  <!-- rose window -->
  <circle cx="600" cy="320" r="36" fill="#0f2744"/>
  <circle cx="600" cy="320" r="28" fill="#fbbf24" opacity="0.25"/>
  <circle cx="600" cy="320" r="12" fill="#fde68a" opacity="0.4"/>
  <!-- side windows glow -->
  <rect x="420" y="420" width="60" height="100" fill="#fbbf24" opacity="0.15"/>
  <rect x="720" y="420" width="60" height="100" fill="#fbbf24" opacity="0.15"/>
</svg>
